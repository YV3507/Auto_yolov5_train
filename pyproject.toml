[project]
name = "auto-yolov5-train"
version = "1.0.0"
description = "YOLOv5 自动化训练管道"
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests>=2.23.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
# YOLOv5 训练依赖（当使用 uv sync 安装训练环境时启用）
train = [
    "torch>=1.7.0",
    "torchvision>=0.8.1",
    "opencv-python>=4.1.1",
    "matplotlib>=3.2.2",
    "numpy>=1.18.5",
    "Pillow>=7.1.2",
    "PyYAML>=5.3.1",
    "scipy>=1.4.1",
    "thop>=0.1.1",
    "tqdm>=4.64.0",
    "tensorboard>=2.4.1",
    "pandas>=1.1.4",
    "seaborn>=0.11.0",
    "psutil",
    "gitpython",
    "ipython",
]

[tool.uv]
# uv 工具配置，参考 https://docs.astral.sh/uv/

[tool.uv.sources]
# 如果使用 PyTorch 官方源，可以在此添加 index-url 配置
# 默认从 PyPI 安装，如需 CUDA 版本请参考下方注释
